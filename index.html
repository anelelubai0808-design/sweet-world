<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сладкий Мир — Кондитерская</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap");

      :root {
        --primary-color: #ff6b81;
        --primary-hover: #ff4757;
        --accent-color: #ffa502;
        --bg-color: #fff9f5;
        --card-bg: #ffffff;
        --text-color: #2f3542;
        --text-light: #747d8c;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Montserrat", sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      header {
        background: linear-gradient(135deg, #ff6b81, #ff8e53);
        color: white;
        padding: 1.2rem 2rem;
        box-shadow: 0 4px 15px rgba(255, 107, 129, 0.25);
      }

      .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .logo {
        font-size: 1.8rem;
        font-weight: 700;
      }

      .nav-links {
        display: flex;
        gap: 1rem;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.15);
        transition: all 0.3s;
      }

      .nav-links a:hover,
      .nav-links a.active {
        background: white;
        color: var(--primary-color);
      }

      .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }

      .filters {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }

      .filters input,
      .filters select {
        padding: 12px 18px;
        border: 2px solid #ffeaa7;
        border-radius: 25px;
        font-size: 0.95rem;
        outline: none;
        background: white;
        transition: border-color 0.3s;
      }

      .filters input {
        flex: 2;
        min-width: 200px;
      }

      .filters select {
        flex: 1;
        min-width: 160px;
        cursor: pointer;
      }

      .filters input:focus,
      .filters select:focus {
        border-color: var(--primary-color);
      }

      #status {
        margin-bottom: 1rem;
        font-weight: 600;
        color: var(--text-light);
      }

      .products {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
      }

      .product-card {
        background: var(--card-bg);
        border-radius: 20px;
        padding: 1.5rem;
        border: 1px solid #ffeaa7;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 25px rgba(255, 107, 129, 0.2);
      }

      .category-badge {
        align-self: flex-start;
        background: #ffeaa7;
        color: #d63031;
        font-size: 0.8rem;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        margin-bottom: 0.8rem;
      }

      .product-card h3 {
        font-size: 1.3rem;
        margin-bottom: 0.5rem;
      }

      .product-card p {
        color: var(--text-light);
        font-size: 0.9rem;
        margin-bottom: 1.2rem;
        line-height: 1.4;
      }

      .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }

      .price {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--primary-color);
      }

      .btn-add {
        background: linear-gradient(135deg, #ff6b81, #ff4757);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 20px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      .btn-add:hover {
        opacity: 0.9;
        transform: scale(1.05);
      }
    </style>

    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="logo">🍰 Сладкий Мир</div>
        <nav class="nav-links">
          <a href="index10.html" class="active">Каталог</a>
          <a href="cart.html">Корзина <span id="cartCount">(0)</span> 🛒</a>
          <a href="profile.html">Кабинет 👤</a>
          <a href="admin.html">Админка ⚙️</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Поиск сладостей..." />

        <select id="categoryFilter">
          <option value="all">Все категории</option>
          <option value="Торты">Торты</option>
          <option value="Пирожные">Пирожные</option>
          <option value="Выпечка">Выпечка</option>
          <option value="Десерты">Десерты</option>
        </select>

        <select id="sortSelect">
          <option value="default">Сортировка</option>
          <option value="desc">Сначала дороже</option>
          <option value="asc">Сначала дешевле</option>
        </select>
      </div>

      <div id="status">Загрузка товаров...</div>
      <div id="productsContainer" class="products"></div>
    </main>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "myproject-306ee.firebaseapp.com",
        projectId: "myproject-306ee",
        storageBucket: "myproject-306ee.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      let products = [];

      const searchInput = document.getElementById("searchInput");
      const categoryFilter = document.getElementById("categoryFilter");
      const sortSelect = document.getElementById("sortSelect");
      const statusDiv = document.getElementById("status");
      const productsContainer = document.getElementById("productsContainer");

      db.collection("products").onSnapshot(
        (snapshot) => {
          products = [];
          snapshot.forEach((doc) => {
            products.push({
              id: doc.id,
              ...doc.data(),
            });
          });
          showProducts();
        },
        (error) => {
          console.error("Ошибка загрузки:", error);
          statusDiv.innerText = "Ошибка загрузки товаров";
        },
      );

      function showProducts() {
        const searchVal = searchInput.value.toLowerCase().trim();
        const catVal = categoryFilter.value;
        const sortVal = sortSelect.value;

        let filtered = products.filter((p) => {
          const matchesSearch = p.name
            ? p.name.toLowerCase().includes(searchVal)
            : true;
          const matchesCat = catVal === "all" || p.category === catVal;
          return matchesSearch && matchesCat;
        });

        if (sortVal === "asc") filtered.sort((a, b) => a.price - b.price);
        if (sortVal === "desc") filtered.sort((a, b) => b.price - a.price);

        statusDiv.innerText = `Найдено товаров: ${filtered.length}`;

        if (filtered.length === 0) {
          productsContainer.innerHTML = "<p>Ничего не найдено 🍩</p>";
          return;
        }

        productsContainer.innerHTML = filtered
          .map(
            (p) => `
          <div class="product-card">
            <div>
              <span class="category-badge">${p.category || "Десерт"}</span>
              <h3>${p.name}</h3>
              <p>${p.description || ""}</p>
            </div>
            <div class="card-footer">
              <span class="price">${p.price} ₸</span>
              <button class="btn-add" onclick="addToCart('${p.id}')">В корзину</button>
            </div>
          </div>
        `,
          )
          .join("");
      }

      searchInput.addEventListener("input", showProducts);
      categoryFilter.addEventListener("change", showProducts);
      sortSelect.addEventListener("change", showProducts);

      function getCart() {
        return JSON.parse(localStorage.getItem("sweet_world_cart")) || [];
      }

      function updateCartBadge() {
        const cart = getCart();
        const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
        const badge = document.getElementById("cartCount");
        if (badge) badge.innerText = `(${totalCount})`;
      }

      function addToCart(productId) {
        const product = products.find((p) => p.id === productId);
        if (!product) return;

        let cart = getCart();
        const existingItem = cart.find((item) => item.id === productId);

        if (existingItem) {
          existingItem.quantity += 1;
        } else {
          cart.push({ ...product, quantity: 1 });
        }

        localStorage.setItem("sweet_world_cart", JSON.stringify(cart));
        updateCartBadge();
        alert(`«${product.name}» добавлен в корзину! 🍰`);
      }

      updateCartBadge();
    </script>
  </body>
</html>
